<div class="slider-container">
    <div class="slider">
      <div class="slider-item" routerLink="/">
        <i class="fa-regular fa-house"></i>
        <span>Home</span>
      </div>
      <div class="slider-item" routerLink="/orders">
        <i class="fa-regular fa-bag-shopping"></i>
        <span>Orders</span>
      </div>
      <div class="slider-item" routerLink="/fav">
        <i class="fa-regular fa-heart"></i>
        <span>Favorites</span>
      </div>
      <div class="slider-item" routerLink="/cart">
        <i class="fa-sharp fa-regular fa-cart-shopping"></i>
        <span>Cart</span>
      </div>
      <div class="slider-item" routerLink="/address">
        <i class="fa-regular fa-map-location-dot"></i>
        <span>Address</span>
      </div>
      <div class="slider-item" routerLink="/change-password">
        <i class="fa-regular fa-lock"></i>
        <span>Change Password</span>
      </div>
      <div class="slider-item" routerLink="/logout">
        <i class="fa-regular fa-arrow-right-from-bracket"></i>
        <span>Logout</span>
      </div>
    </div> 
  </div>
  

<div class="profileContainer">

    <div class="imageBox">
      <!-- <img src="../../assets/blob.svg" alt="" id="type"> -->
      <img [src]="userImg" alt="" id="proImg">
      
    </div>
    
    <div class="userInfo">
        <i (click)="logOut()" class="fa-regular fa-arrow-right-from-bracket" id="logOutIcon"></i>
        <i (click)="updateUser()" class="fa fa-edit" id="editIcon"></i>
        <h1>{{userName}}</h1>
        <div class="info">
            <div class="details1">
                <div class="emailInfo">
                    <div class="icon">
                       Email <i class="fa-regular fa-envelope"></i>
                    </div>
                    <div class="val">
                       <span style="font-family: futur;">{{email}}</span> 
                    </div>
                </div>
                <hr>
                <div class="mobileNo">
                    <div class="icon">
                        Mobile No <i class="fa-regular fa-mobile"></i>
                    </div>
                    
                    <div class="val">
                        <span style="font-family: futur;">{{phoneNo}}</span>
                    </div>
                </div>
                <hr>
                <div class="gender">
                    <div class="icon">
                        Gender <i class="fa-regular fa-venus-mars"></i>
                    </div>
                    
                    <div class="val">
                        <span style="font-family: futur;">{{gender}}</span>
                    </div>
                </div>
                <hr>
            </div>
        </div>
        
    
        <!-- <ul class="link">
            <li><a routerLink="/cart"><i class="fa-sharp fa-regular fa-cart-shopping"></i> Cart</a></li>
            <li><a routerLink=""><i class="fa-sharp fa-thin fa-bag-shopping"></i> Orders</a></li>
            <li><a routerLink="/fav"><i class="fa-sharp fa-regular fa-star"></i> Favourite</a></li>
        </ul> -->
    </div>
</div>
